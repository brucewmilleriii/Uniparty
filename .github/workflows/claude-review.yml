name: Claude review

# Claude reviews every pull request for bugs, security problems and missing
# tests, and leaves its findings as comments on the PR. It reviews again on
# each new push.
#
# Needs the ANTHROPIC_API_KEY repo secret (from https://console.anthropic.com).
# Until it is added, this job skips with a warning instead of failing.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts, and PRs from forks (they cannot read repo secrets).
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Skip until the API key is added
        id: key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::The ANTHROPIC_API_KEY repo secret is not set, so this PR was not reviewed. Create a key at https://console.anthropic.com and add it under Settings > Secrets and variables > Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.ready == 'true'
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        if: steps.key.outputs.ready == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Uniparty is a public political tracker, so
            published numbers (votes, bills, donations, trades) must match the
            official sources exactly; treat anything that could publish wrong or
            partial data as a serious bug.

            Look for:
            - Bugs: logic errors, unhandled edge cases, wrong data mapping.
            - Security: leaked secrets, unsafe handling of fetched data, server-only
              code or keys reaching the client.
            - Test gaps: changed behaviour with no test covering it.

            Read AGENTS.md first; this repo's Next.js version differs from older ones.
            Only flag real problems, not style preferences. Use inline comments for
            specific lines, then one short summary comment. If nothing is wrong, say
            so in one line.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
