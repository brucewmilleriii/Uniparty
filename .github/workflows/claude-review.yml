name: Claude review

# Temporarily disabled: anthropics/claude-code-action@v1 currently crashes on
# GitHub-hosted runners with a Bun/tsconfig bug (directory mismatch for
# tsconfig.json), which fails the job before the review runs. See:
# - https://github.com/anthropics/claude-code-action/issues/1234
# - https://github.com/anthropics/claude-code-action/issues/1295
#
# Re-enable this workflow once Anthropic/Bun resolve the upstream issue or a
# known-good action version is available.
on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    # Kept as a placeholder so the workflow can be re-enabled without rewriting
    # the job definition. Currently disabled to avoid failing CI.
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Claude review is disabled until the upstream Bun/tsconfig issue is fixed."
